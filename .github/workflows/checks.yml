name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint, build paste file, run tests
        shell: pwsh
        run: ./tools/Invoke-Checks.ps1

      - name: Committed paste file matches src/
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/EverythingIsFine.ps1 is out of date. Run ./tools/Build-PasteFile.ps1 and commit."
            exit 1
          fi
